name: CI

on:
   pull_request:
   push:
      branches: [main]

jobs:
   validate:
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         # the version comes from "packageManager" in package.json
         - name: Setup pnpm
           uses: pnpm/action-setup@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: pnpm

         - name: Install deps
           run: pnpm install --frozen-lockfile

         - name: Format check
           run: pnpm format:check

         # turbo builds the packages each of these needs first
         - name: Typecheck
           run: pnpm typecheck

         - name: Test
           run: pnpm test

         # type checks miss what only a real build catches, such as the web app failing to bundle
         - name: Build
           run: pnpm build
