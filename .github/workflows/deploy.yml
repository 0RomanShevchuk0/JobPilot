name: Deploy

on:
   workflow_run:
      workflows: [CI]
      branches: [main]
      types: [completed]
   workflow_dispatch:

jobs:
   build:
      if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
      runs-on: ubuntu-latest

      # GITHUB_TOKEN is read-only by default; pushing to ghcr.io needs write.
      permissions:
         packages: write

      # one job per image, side by side: each with its own log, a failed one named in the run.
      # The worker's image runs the migrations too (the migrate service)
      strategy:
         matrix:
            app: [worker, api, web]

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Log in to ghcr.io
           run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

         # ghcr.io rejects uppercase in image names, so the owner is spelled out in lower case.
         # The runner is x86-64 like the server, so the image is built for it as is.
         - name: Build the ${{ matrix.app }} image
           run: docker build -f apps/${{ matrix.app }}/Dockerfile -t ghcr.io/0romanshevchuk0/jobpilot-${{ matrix.app }}:latest .

         - name: Push the image
           run: docker push ghcr.io/0romanshevchuk0/jobpilot-${{ matrix.app }}:latest

   deploy:
      # Only runs once every image is built and pushed: one failed, and the server keeps what it runs.
      needs: build
      runs-on: ubuntu-latest

      steps:
         - name: Install the deploy key
           run: |
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              echo "${{ secrets.JOBPILOT_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              # Records the server's host key so ssh does not stop to ask about it.
              ssh-keyscan -H "${{ vars.JOBPILOT_HOST }}" >> ~/.ssh/known_hosts

         # The migrate service brings the database schema up to date before the new worker and API start.
         - name: Pull the new image and restart
           run: |
              ssh -i ~/.ssh/deploy_key "${{ secrets.JOBPILOT_SSH_USER }}@${{ vars.JOBPILOT_HOST }}" '
                 set -eu
                 # the repo is cloned as root into /opt/jobpilot, hence sudo throughout
                 cd /opt/jobpilot
                 sudo git pull --ff-only
                 sudo docker compose -f docker-compose.prod.yml pull
                 sudo docker compose -f docker-compose.prod.yml up -d
                 sudo docker image prune -f
              '
