name: jobpilot

services:
   postgres:
      image: pgvector/pgvector:pg18
      environment:
         POSTGRES_USER: jobpilot
         POSTGRES_PASSWORD: jobpilot
         POSTGRES_DB: jobpilot
      ports:
         - "5433:5432"
      volumes:
         # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent
         - pgdata:/var/lib/postgresql
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
         interval: 5s
         timeout: 3s
         retries: 10

   redis:
      image: redis:8-alpine
      # BullMQ requirements: never evict keys, persist jobs across restarts
      command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
      ports:
         - "6379:6379"
      volumes:
         - redisdata:/data
      healthcheck:
         test: ["CMD", "redis-cli", "ping"]
         interval: 5s
         timeout: 3s
         retries: 10

volumes:
   pgdata:
   redisdata:
