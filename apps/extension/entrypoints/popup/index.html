<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>JobPilot</title>
      <link rel="stylesheet" href="./style.css" />
   </head>
   <body>
      <header>
         <h1>JobPilot</h1>
         <a id="open-web" target="_blank">Open JobPilot ↗</a>
      </header>
      <section id="application-tabs" hidden>
         <h2>In progress</h2>
         <ul id="application-tabs-list" class="sites"></ul>
      </section>
      <section>
         <h2>Sessions</h2>
         <p class="hint">Sent by themselves when you log in to a job site.</p>
         <p id="sessions-checking" class="loading" hidden>
            <span class="spinner"></span>Checking with JobPilot whether they still work…
         </p>
         <ul id="sessions-list" class="sites"></ul>
         <button id="send-sessions" type="button">Send sessions now</button>
      </section>
      <script type="module" src="./main.ts"></script>
   </body>
</html>
